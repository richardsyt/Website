<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<title>Dr Richard Yitong Shao — Neurologist & Neuromuscualr Specialist, Sydney</title>
<meta name="description" content="Neurologist in Sydney with expertise in Neuromuscular and General neurology conditions.">
<link rel="canonical" href="https://www.drrichardshao.com.au/">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Dr [Full Name] — site styles
   One file for all five pages. Change a colour here and every
   page follows. Dark mode is automatic and follows the device.
   ============================================================ */

:root{
  --paper:#F6F8F9; --surface:#FFFFFF; --ink:#12212B; --ink-soft:#4A5C68;
  --line:#D6DFE4; --accent:#0E6B72; --focus:#B4531A;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Newsreader",Georgia,serif;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0D161C; --surface:#16232B; --ink:#E9EFF2; --ink-soft:#A9BAC4;
    --line:#2B3B45; --accent:#63CFD4; --focus:#FFB169;
    color-scheme:dark;
  }
}

html{font-size:112.5%}                 /* 18px base */
html[data-size="l"]{font-size:125%}
html[data-size="xl"]{font-size:143.75%}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.wrap{width:min(62rem,100%);margin-inline:auto;padding-inline:clamp(1.25rem,5vw,2rem)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:1rem;top:1rem;background:var(--surface);padding:.75rem 1rem;border:2px solid var(--accent);z-index:9}

/* ---------- Header ---------- */
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:1rem;min-height:4.5rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:2.2rem;height:2.2rem;color:var(--accent);flex:none}
.brand b{font-family:var(--font-display);font-weight:500;font-size:1.1rem;display:block;line-height:1.15}
.brand em{font-style:normal;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
nav{display:flex;gap:.15rem}
nav a{padding:.6rem .7rem;text-decoration:none;color:var(--ink-soft);font-size:.95rem;border-radius:var(--radius)}
nav a:hover{color:var(--accent);background:var(--surface)}
nav a[aria-current="page"]{color:var(--accent);font-weight:700}
@media(max-width:44rem){
  header .wrap{flex-wrap:wrap;min-height:0;padding-block:.5rem}
  nav{order:3;width:100%;border-top:1px solid var(--line);padding-top:.25rem;justify-content:space-between}
  nav a{padding:.75rem .4rem;font-size:1rem}
}
#sizeBtn{min-height:2.75rem;min-width:2.75rem;padding:0 .7rem;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:var(--radius);font:inherit;font-size:.85rem;cursor:pointer}
#sizeBtn:hover{border-color:var(--accent)}

/* ---------- Home hero ---------- */
.hero{padding:clamp(3rem,10vw,6rem) 0 clamp(3.5rem,10vw,6rem)}
.hero .wrap{display:grid;gap:clamp(1.5rem,5vw,3rem);align-items:center}
@media(min-width:48rem){.hero .wrap{grid-template-columns:1.2fr .8fr}}
.hero h1{margin:0}
.creds{color:var(--ink-soft);font-size:.95rem;letter-spacing:.06em;margin:.6rem 0 1.25rem}
.lede{font-size:1.15rem;color:var(--ink-soft);max-width:34ch;margin:0}
.portrait{border-radius:var(--radius);border:1px solid var(--line);aspect-ratio:4/5;object-fit:cover;width:100%}
@media(max-width:47.99rem){.portrait{max-width:16rem}}

h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.2rem,7vw,3.4rem);
  line-height:1.1;letter-spacing:-.015em}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3.4rem;
  padding:0 1.6rem;margin-top:1.75rem;border-radius:var(--radius);
  background:var(--accent);color:var(--paper);font-weight:700;font-size:1.05rem;
  text-decoration:none;border:2px solid var(--accent);transition:filter .15s ease}
.btn:hover,.btn:focus-visible{filter:brightness(1.1)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* ---------- Sub-page layout ---------- */
.page{padding:clamp(2.25rem,6vw,3.5rem) 0 clamp(3rem,8vw,4.5rem)}
.page h1{margin:0 0 .5rem;font-size:clamp(1.9rem,5.5vw,2.7rem)}
.page-intro{color:var(--ink-soft);font-size:1.05rem;max-width:50ch;margin:0 0 2.5rem}
.page p,.page li{max-width:64ch}
   
h2{font-family:var(--font-display);font-weight:500;font-size:1.4rem;line-height:1.2;margin:2.5rem 0 .75rem}
h3{font-size:1.02rem;font-weight:700;margin:0 0 .5rem}

/* Two-column card grid */
.cols{display:grid;gap:1rem;grid-template-columns:1fr;margin:1.25rem 0 0}
@media(min-width:44rem){.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem}
.card :is(p,li){max-width:none}
.card ul{padding-left:1.15rem;margin:0}
.card li{margin:.3rem 0}
.card > :last-child{margin-bottom:0}

/* Label / value rows — used for qualifications and contact details */
.rows{list-style:none;padding:0;margin:0}
.rows li{display:grid;gap:.15rem;padding:.55rem 0;border-bottom:1px dotted var(--line);max-width:none}
.rows li:last-child{border-bottom:0}
@media(min-width:34rem){.rows li{grid-template-columns:8.5rem 1fr;gap:1rem;align-items:baseline}}
.rows b{font-weight:400;color:var(--ink-soft);font-size:.9rem}
.tel{font-weight:700;white-space:nowrap}

/* Link lists — resources */
.links{list-style:none;padding:0;margin:0}
.links li{padding:.55rem 0;border-bottom:1px dotted var(--line);max-width:none}
.links li:last-child{border-bottom:0}
.links a{font-weight:700}
.links span{display:block;color:var(--ink-soft);font-size:.92rem}

/* Quiet block, e.g. referral details for GPs */
.quiet{border-top:1px solid var(--line);margin-top:3rem;padding-top:2rem}
.quiet h2{margin-top:0}

.note{color:var(--ink-soft);font-size:.95rem}

footer{border-top:1px solid var(--line);padding:1.75rem 0 2.25rem;color:var(--ink-soft);font-size:.88rem}
footer p{margin:0}
footer a{color:var(--ink-soft)}

@media print{
  header nav,#sizeBtn,.btn,.portrait{display:none}
  body{background:#fff;color:#000;font-size:11pt}
  a{color:#000;text-decoration:none}
  .card{border:1px solid #999;break-inside:avoid}
}
</style>
<script>try{var s=localStorage.getItem('size');if(s)document.documentElement.setAttribute('data-size',s)}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg class="mark" width="36" height="36" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <circle cx="24" cy="24" r="19.5" stroke-width="2.2" opacity=".35"/>
        <path d="M15 33c0-6 5-6.5 5-11.5S15 15 15 15"/>
        <path d="M24 33c0-6 5-6.5 5-11.5S24 15 24 15"/>
        <circle cx="33" cy="24" r="2.4" fill="currentColor" stroke="none"/>
      </svg>
      <span><b>Dr Richard (Yitong) Shao </b><em>Neurologist & Neurophysiologist</em></span>
    </a>
    <nav aria-label="Main">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contacts.html">Contacts</a>
      <a href="resources.html">Resources</a>
    </nav>
    <button id="sizeBtn" aria-pressed="false" aria-label="Text size: normal. Press to change.">A<sup>+</sup></button>
  </div>
</header>

<main id="main">

  <div class="hero">
    <div class="wrap">
      <div>
        <h1>Dr Richard (Yitong) Shao</h1>
        <p class="creds">MD FRACP</p>
        <p class="lede">Neurologist in Sydney with expertise in Neuromuscular and General neurology conditions.</p>
        <a class="btn" href="contacts.html">Make a booking</a>
      </div>
      <img class="portrait" src="assets/Richard Shao-3365.jpg" alt="Portrait of Dr Shao">
    </div>
  </div>

</main>

<footer>
  <div class="wrap">
    <p> &middot; <a href="privacy.html">Privacy</a></p>
  </div>
</footer>

<script>
// Text size: normal (18px) -> large (20px) -> extra large (23px). Remembered per device.
(function(){
  var root=document.documentElement, btn=document.getElementById('sizeBtn'),
      steps=['','l','xl'], names=['normal','large','extra large'], i=0, store=null;
  try{ store=localStorage; var s=store.getItem('size'); if(s!==null){var j=steps.indexOf(s); if(j>-1)i=j;} }catch(e){}
  function apply(){
    if(steps[i]) root.setAttribute('data-size',steps[i]); else root.removeAttribute('data-size');
    btn.setAttribute('aria-pressed', i>0?'true':'false');
    btn.setAttribute('aria-label','Text size: '+names[i]+'. Press to change.');
    try{ store.setItem('size',steps[i]); }catch(e){}
  }
  apply();
  btn.addEventListener('click',function(){ i=(i+1)%steps.length; apply(); });
})();
</script>
</body>
</html>
